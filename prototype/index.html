<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>NEXORA Mobile Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#07121d;color:#fff;font-family:system-ui;overflow:hidden;touch-action:none}#game{display:block;width:100vw;height:100vh;background:linear-gradient(#62b8ee 0 48%,#218b73 48%)}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:center;pointer-events:none}.pill{background:#07121dcc;border:1px solid #ffffff33;border-radius:18px;padding:8px 12px;font-weight:700;font-size:13px}#tip{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#07121dcc;padding:7px 12px;border-radius:12px;font-size:12px;white-space:nowrap}#joy{position:fixed;left:22px;bottom:28px;width:126px;height:126px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff16}#stick{position:absolute;width:52px;height:52px;border-radius:50%;background:#ffffff99;left:35px;top:35px}.actions{position:fixed;right:18px;bottom:25px;display:grid;grid-template-columns:repeat(2,68px);gap:12px}.btn{width:68px;height:68px;border:0;border-radius:50%;background:#102b3dcc;color:white;font-weight:800;border:2px solid #ffffff55}.btn:active{transform:scale(.94);background:#236488}#build{border-radius:18px;grid-column:1/3;width:148px;height:48px}@media(min-width:800px){#joy{left:8%;}.actions{right:8%}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill">⚡ <span id="energy">100</span></div><div class="pill">🔩 <span id="metal">150</span></div><div class="pill">💳 <span id="credits">500</span></div></div><div id="tip">NEXORA • Move with joystick • Build your first base</div><div id="joy"><div id="stick"></div></div><div class="actions"><button class="btn" id="mine">MINE</button><button class="btn" id="boost">BOOST</button><button class="btn" id="build">BUILD OUTPOST · 50 🔩</button></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr,p={x:0,y:0},cam={x:0,y:0},v={x:0,y:0},metal=150,energy=100,credits=500,buildings=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const joy=document.getElementById('joy'),stick=document.getElementById('stick');let pid=null;function jmove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy)||1,k=Math.min(42,m)/m;v.x=dx*k/42;v.y=dy*k/42;stick.style.transform=`translate(${dx*k}px,${dy*k}px)`}joy.addEventListener('pointerdown',e=>{pid=e.pointerId;joy.setPointerCapture(pid);jmove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pid)jmove(e)});function stop(e){if(e.pointerId===pid){pid=null;v.x=v.y=0;stick.style.transform=''}}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);function hud(){energy.textContent=Math.floor(energy);document.getElementById('metal').textContent=metal;document.getElementById('credits').textContent=credits}document.getElementById('mine').onclick=()=>{metal+=10;energy=Math.max(0,energy-4);hud()};document.getElementById('boost').onclick=()=>{if(energy>=5){energy-=5;p.x+=v.x*35;p.y+=v.y*35;hud()}};document.getElementById('build').onclick=()=>{if(metal>=50){metal-=50;buildings.push({x:p.x+70,y:p.y});hud();document.getElementById('tip').textContent='Outpost deployed! Collect metal and expand.'}else document.getElementById('tip').textContent='Need 50 metal.'};function draw(){x.clearRect(0,0,W,H);cam.x+=(p.x-cam.x)*.08;cam.y+=(p.y-cam.y)*.08;const ox=W/2-cam.x,oy=H/2-cam.y;x.fillStyle='#65bdeb';x.fillRect(0,0,W,H);x.fillStyle='#168b79';x.beginPath();x.ellipse(ox,oy,420,280,0,0,Math.PI*2);x.fill();x.fillStyle='#d6c879';x.beginPath();x.ellipse(ox,oy,350,220,0,0,Math.PI*2);x.fill();x.fillStyle='#43a85c';x.beginPath();x.ellipse(ox,oy,310,185,0,0,Math.PI*2);x.fill();for(let i=0;i<10;i++){let a=i*.63,r=110+(i%3)*45;x.fillStyle='#24723f';x.beginPath();x.arc(ox+Math.cos(a)*r,oy+Math.sin(a)*r,12,0,7);x.fill()}buildings.forEach(b=>{let bx=ox+b.x,by=oy+b.y;x.fillStyle='#253a50';x.fillRect(bx-24,by-18,48,36);x.fillStyle='#69d9ff';x.fillRect(bx-13,by-8,26,12);x.fillStyle='#ddd';x.fillRect(bx-4,by-35,8,17)});let px=ox+p.x,py=oy+p.y;x.fillStyle='#f3f6f8';x.beginPath();x.arc(px,py-12,13,0,7);x.fill();x.fillStyle='#243e55';x.fillRect(px-10,py,20,27);x.fillStyle='#8ce8ff';x.fillRect(px-8,py-17,16,8);x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(px-7,py+25);x.lineTo(px-10,py+39);x.moveTo(px+7,py+25);x.lineTo(px+10,py+39);x.stroke();requestAnimationFrame(draw)}function tick(){let s=2.6;p.x+=v.x*s;p.y+=v.y*s;let rr=Math.hypot(p.x/300,p.y/175);if(rr>1){p.x/=rr;p.y/=rr}energy=Math.min(100,energy+.015);hud()}setInterval(tick,16);hud();draw();</script></body></html>
